<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasil Ujian</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <!-- Global Loading Screen -->
    <div id="global-loading-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: 'Outfit', sans-serif; transition: opacity 0.4s ease, visibility 0.4s ease;">
      <div style="text-align: center; max-width: 400px; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
        <div class="anti-cheat-icon" style="font-size: 4rem;">⏳</div>
        <div style="font-weight: 800; font-size: 1.6rem; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Memuat Hasil Ujian</div>
        <p style="color: #64748b; font-size: 0.95rem; line-height: 1.6; margin: 0;">Sistem sedang mengambil hasil pengerjaan ujian Anda dari server. Mohon tunggu sebentar...</p>
        <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-top: 1rem; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #4f46e5, #3b82f6); border-radius: 9999px; position: absolute; top: 0; left: 0; animation: loadingBar 1.5s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>

    <header class="topbar">
      <h1>Hasil Ujian</h1>
      <a id="result-back-btn" class="link-btn" href="/pages/student.html">Kembali ke Daftar</a>
    </header>

    <main class="container">
      <section class="card" style="text-align: center; margin-bottom: 2rem;">
        <p id="result-score-subtitle" style="margin: 0; font-size: 1.1rem; color: var(--muted); font-weight: 500;">Total Skor</p>
        <h2 id="result-score" style="margin: 0.5rem 0 0 0;">0</h2>
      </section>

      <!-- Ringkasan Statistik Pengerjaan -->
      <div id="result-summary-grid" class="hidden" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
        <div class="card" style="text-align: center; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.7);">
          <div style="font-size: 0.85rem; color: #64748b; font-weight: 600;">Total Soal</div>
          <div id="stat-total-questions" style="font-size: 1.5rem; font-weight: 800; color: var(--brand); margin-top: 0.25rem;">0</div>
        </div>
        <div class="card" style="text-align: center; padding: 1rem; border-radius: 12px; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);">
          <div style="font-size: 0.85rem; color: #059669; font-weight: 600;">Benar</div>
          <div id="stat-correct" style="font-size: 1.5rem; font-weight: 800; color: #059669; margin-top: 0.25rem;">0</div>
        </div>
        <div class="card" style="text-align: center; padding: 1rem; border-radius: 12px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);">
          <div style="font-size: 0.85rem; color: #d97706; font-weight: 600;">Sebagian</div>
          <div id="stat-partial" style="font-size: 1.5rem; font-weight: 800; color: #d97706; margin-top: 0.25rem;">0</div>
        </div>
        <div class="card" style="text-align: center; padding: 1rem; border-radius: 12px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);">
          <div style="font-size: 0.85rem; color: #dc2626; font-weight: 600;">Salah</div>
          <div id="stat-wrong" style="font-size: 1.5rem; font-weight: 800; color: #dc2626; margin-top: 0.25rem;">0</div>
        </div>
        <div id="stat-manual-card" class="card hidden" style="text-align: center; padding: 1rem; border-radius: 12px; background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);">
          <div style="font-size: 0.85rem; color: #4f46e5; font-weight: 600;">Perlu Koreksi Guru</div>
          <div id="stat-manual" style="font-size: 1.5rem; font-weight: 800; color: #4f46e5; margin-top: 0.25rem;">0</div>
        </div>
      </div>

      <h3 id="result-breakdown-title" style="margin-bottom: 1.5rem; color: var(--text);">Detail Jawaban</h3>
      <div id="result-breakdown" class="stack"></div>
    </main>

    <script type="module" src="/js/pages/resultPage.js"></script>
  </body>
</html>
